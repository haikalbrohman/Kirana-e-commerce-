# Build dasbor (dashboard-app/) lalu terbitkan seluruh situs ke GitHub Pages.
name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-app/package-lock.json

      - name: Build dasbor
        working-directory: dashboard-app
        run: |
          npm ci
          npm run build

      # Hanya file situs statis yang diterbitkan (tanpa kode sumber, backend, atau node_modules).
      - name: Siapkan folder situs
        run: |
          mkdir -p _site
          cp -r index.html manifest.json sw.js .nojekyll css js icons dashboard _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
