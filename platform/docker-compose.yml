# PostgreSQL untuk pengembangan lokal: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopia
    ports:
      - "5432:5432"
    volumes:
      - shopia-db:/var/lib/postgresql/data
volumes:
  shopia-db:
